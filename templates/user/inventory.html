{% extends 'includes/base_user.html' %}

{% block content %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

<div class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <div class="container mx-auto p-6 lg:p-8 flex-grow">
        <h1 class="text-4xl font-extrabold mb-8 text-center text-gray-900 tracking-tight">
            <i class="fas fa-warehouse mr-2 text-orange-600"></i>Inventario y Ventas
        </h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Escáner QR -->
            <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-qrcode mr-2 text-orange-500"></i>Escanear Código QR
                </h2>
                <div id="qr-reader" class="w-full mb-4 border border-gray-200 rounded-lg overflow-hidden"></div>
                <div id="qr-result" class="text-center text-lg font-medium text-gray-700 italic"></div>
            </div>

            <!-- Carrito con Buscador -->
            <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300">
                <h2 class="text-2xl font-semibold mb-4 text-gray-800">
                    <i class="fas fa-box-open mr-2 text-orange-500"></i>Carrito de Ventas
                </h2>
                
                <!-- Sección de búsqueda -->
                <div class="mb-6">
                    <div class="relative">
                        <input type="text" 
                               id="product-search" 
                               placeholder="Buscar producto por ID..." 
                               class="w-full p-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <div id="search-results" class="mt-2 max-h-40 overflow-y-auto hidden"></div>
                </div>

                <div id="cart_items" class="space-y-4 max-h-80 overflow-y-auto scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-gray-100"></div>
                <div class="mt-6 border-t border-gray-200 pt-4">
                    <p id="cart_total" class="font-semibold text-lg text-gray-800">Total: $0.00</p>
                    <button id="checkout_btn" 
                            data-modal-target="checkout-modal" 
                            data-modal-toggle="checkout-modal" 
                            class="mt-4 w-full bg-orange-600 text-white py-3 rounded-lg hover:bg-orange-700 transition duration-200 font-medium shadow-sm">
                        <i class="fas fa-check-circle mr-2"></i>Confirmar Venta
                    </button>
                    <!-- Alerta -->
                    <div id="alert_container" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación -->
    <div id="checkout-modal" tabindex="-1" aria-hidden="true" 
         class="fixed hidden inset-0 z-50 w-full p-4 overflow-x-hidden overflow-y-auto h-full bg-black/50">
        <div class="relative w-full max-w-md mx-auto">
            <div class="bg-white rounded-lg shadow-lg">
                <div class="flex items-center justify-between p-5 border-b border-gray-200 rounded-t">
                    <h3 class="text-xl font-semibold text-gray-900">
                        <i class="fas fa-receipt mr-2 text-orange-500"></i>Detalle de Venta
                    </h3>
                    <button type="button" data-modal-hide="checkout-modal" class="text-gray-400 hover:text-gray-900 hover:bg-gray-200 p-1.5 rounded-lg">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 14 14">
                            <path stroke="currentColor" stroke-width="2" d="M1 1l12 12M1 13L13 1"/>
                        </svg>
                    </button>
                </div>
                <div class="p-5">
                    <h4 class="text-lg font-semibold mb-3 border-b border-gray-200 pb-2">Productos Seleccionados</h4>
                    <div id="modal_products" class="space-y-3 max-h-60 overflow-y-auto pr-2 mb-4"></div>

                    <div class="bg-gray-50 p-4 rounded-lg">
                        <div class="flex justify-between text-lg font-bold">
                            <span>Total a Pagar:</span>
                            <span id="modal_total" class="text-orange-600">$0.00</span>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="payment_method" class="block text-sm font-medium text-gray-700">Método de Pago</label>
                        <select id="payment_method" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                            <option value="cash">Efectivo</option>
                            <option value="transfer">Transferencia</option>
                            <option value="stripe">Tarjeta (Stripe)</option>
                        </select>
                    </div>

                    <div id="transfer_form" class="mt-4 hidden">
                        <input type="text" id="account_number" placeholder="Número de cuenta" class="w-full p-2 mt-2 border border-gray-300 rounded-md">
                        <input type="text" id="bank_name" placeholder="Nombre del banco" class="w-full p-2 mt-2 border border-gray-300 rounded-md">
                        <input type="date" id="transfer_date" class="w-full p-2 mt-2 border border-gray-300 rounded-md">
                        <input type="text" id="reference_number" placeholder="Número de referencia" class="w-full p-2 mt-2 border border-gray-300 rounded-md">
                    </div>

                    <div id="stripe_form" class="mt-4 hidden">
                        <div id="card-element" class="w-full p-2 border border-gray-300 rounded-md"></div>
                        <div id="card-errors" class="text-red-500 mt-2"></div>
                    </div>
                </div>
                <div class="flex justify-end p-5 border-t border-gray-200">
                    <button data-modal-hide="checkout-modal" type="button" class="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-200 mr-2">Cancelar</button>
                    <button id="confirm_checkout" type="button" class="bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600">Confirmar Pago</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
    const stripePublicKey = '{{ stripe_public_key }}';
    console.log('stripePublicKey cargado:', stripePublicKey);
</script>
<script src="{{ url_for('static', filename='js/sales.js') }}" onerror="console.error('Error al cargar sales.js')"></script>
<script src="{{ url_for('static', filename='js/qr.js') }}" onerror="console.error('Error al cargar qr.js')"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM completamente cargado');
        const searchInput = document.getElementById('product-search');
        const qrResultDiv = document.getElementById('qr-result');

        // Función para agregar producto por ID
        async function addProductById(productId) {
            try {
                // Verificar si el producto ya está en el carrito
                const cartItems = document.querySelectorAll('#cart_items div[data-product-id]');
                let productExists = false;

                cartItems.forEach(item => {
                    if (item.dataset.productId === productId) {
                        productExists = true;
                        const quantityInput = item.querySelector('input');
                        const currentQuantity = parseInt(quantityInput.value) || 0;
                        quantityInput.value = currentQuantity + 1; // Incrementar cantidad
                        updateQuantity(productId, currentQuantity + 1); // Actualizar en backend
                    }
                });

                // Si no existe, hacer la solicitud para añadirlo
                if (!productExists) {
                    const response = await fetch('/escanear', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codigo: productId })
                    });
                    const result = await response.json();

                    if (result.success) {
                        qrResultDiv.innerHTML = `<p class="text-green-600">Añadido: ${result.producto} (x${result.cantidad})</p>`;
                        // Actualizar el carrito inmediatamente
                        await updateCartFromQR();
                    } else {
                        qrResultDiv.innerHTML = `<p class="text-red-600">${result.message}</p>`;
                    }
                } else {
                    qrResultDiv.innerHTML = `<p class="text-green-600">Cantidad incrementada para ID: ${productId}</p>`;
                }
            } catch (error) {
                qrResultDiv.innerHTML = `<p class="text-red-600">Error al procesar el ID: ${error.message}</p>`;
            }
        }

        // Función para actualizar el carrito (reutilizando la de qr.js)
        async function updateCartFromQR() {
            try {
                const response = await fetch('/carrito', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();

                if (result.success) {
                    const cart = result.carrito || {};
                    let html = '';
                    let total = 0;

                    Object.entries(cart).forEach(([id, item]) => {
                        const costo = item.price ?? 0;
                        const cantidad = item.cantidad ?? 0;
                        const subtotal = costo * cantidad;
                        total += subtotal;

                        html += `
                            <div data-product-id="${id}" class="border p-4 rounded-lg bg-gray-50 flex justify-between items-center">
                                <div>
                                    <span class="font-semibold text-gray-800">${item.nombre || 'Sin nombre'}</span>
                                    <span class="text-gray-600">$${costo.toFixed(2)}</span>
                                    <input type="number" 
                                           class="w-16 border rounded p-1 text-center" 
                                           value="${cantidad}" 
                                           min="0" 
                                           onchange="updateQuantity('${id}', this.value)">
                                </div>
                                <div class="flex items-center">
                                    <span class="text-gray-700 font-medium">$${subtotal.toFixed(2)}</span>
                                    <button onclick="updateQuantity('${id}', 0)" 
                                            class="ml-3 text-red-500 hover:text-red-700 transition duration-200">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('cart_items').innerHTML = html || '<p class="text-gray-500">Registro vacío</p>';
                    document.getElementById('cart_total').textContent = `Total Registrado: $${total.toFixed(2)}`;
                    document.dispatchEvent(new Event('cartUpdated')); // Disparar evento para sales.js
                } else {
                    document.getElementById('cart_items').innerHTML = `<p class="text-red-600">Error al cargar el registro: ${result.message}</p>`;
                }
            } catch (error) {
                document.getElementById('cart_items').innerHTML = `<p class="text-red-600">Error al cargar el registro: ${error.message}</p>`;
            }
        }

        // Evento al presionar Enter
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const productId = searchInput.value.trim();
                if (productId) {
                    addProductById(productId);
                    searchInput.value = ''; // Limpiar input
                }
            }
        });

        // Evento al salir del input (onblur)
        searchInput.addEventListener('blur', () => {
            const productId = searchInput.value.trim();
            if (productId) {
                addProductById(productId);
                searchInput.value = ''; // Limpiar input
            }
        });
    });
</script>
{% endblock %}
