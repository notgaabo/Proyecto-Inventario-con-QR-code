<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Empresa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-lg rounded-2xl flex max-w-4xl w-full">
        <div class="w-1/2 hidden md:block">
            <img src="{{ url_for('static', filename='img/1.png') }}" alt="Formulario Imagen"
                class="w-full h-full object-cover rounded-l-2xl">
        </div>
        <div class="w-full md:w-1/2 p-8">
            <h2 class="text-3xl font-bold text-orange-500 mb-6">Crear Empresa</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-2 text-center text-white rounded-lg {{ 'bg-green-500' if category == 'success' else 'bg-red-500' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('create_company') }}" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-semibold">Nombre de la Empresa</label>
                    <input type="text" name="name" required placeholder="Ingrese el nombre de la empresa"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold">Industria</label>
                    <input type="text" name="industry" placeholder="Ingrese la industria (opcional)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold">Dirección</label>
                    <input type="text" name="address" placeholder="Ingrese la dirección (opcional)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-gray-700 font-semibold">Teléfono</label>
                    <input type="text" name="phone" placeholder="Ingrese el teléfono (opcional)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <button type="submit"
                    class="w-full bg-orange-500 text-white font-semibold py-2 rounded-lg hover:bg-orange-600 transition">
                    Crear Empresa
                </button>
            </form>
            <a href="{{ url_for('admin_dashboard') }}" class="block text-center mt-4 text-orange-500 hover:underline">
                Volver al dashboard
            </a>
        </div>
    </div>
</body>
</html>
